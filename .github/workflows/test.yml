name: Test pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run pre-commit
        run: |
          uv run pre-commit run --all-files

  unit-tests:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Load env file
        run: |
          grep -vE '^(#|$)' .env.test >> $GITHUB_ENV

      - name: Run unit tests
        run: |
          uv run pytest --cov=futuramaapi --cov-fail-under=70
