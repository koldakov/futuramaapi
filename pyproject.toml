[project]
name = "futuramaapi"
version = "1.13.13"
description = "Inspired REST and GraphQL API based on TV show Futurama."
authors = [{ name = "Ivan Koldakov", email = "ivan.koldakov@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "hypercorn[uvloop]>=0.18.0,<0.19",
    "pydantic-settings>=2.15.0",
    "asyncpg>=0.32.0",
    "anyio>=4.14.2",
    "pydash>=8.1.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3,<7",
    "python-multipart>=0.0.32,<0.0.33",
    "greenlet>=3.5.4",
    "httpx>=0.28.1,<0.29",
    "aiocache>=0.12.3,<0.13",
    "cryptography>=49.0.0",
    "sqlalchemy>=2.0.51",
    "fastapi>=0.141.0",
    "sse-starlette>=3.5.0",
    "fastapi-mail>=1.6.5",
    "sentry-sdk>=2.72.0",
    "fastapi-pagination>=0.16.1",
    "redis>=8.1.0",
    "pydantic>=2.13.4",
    "alembic>=1.20.0",
    "strawberry-graphql>=0.334.2",
    "markdown>=3.11",
    "bleach>=6.4.0,<7",
    "aiofiles>=25.1.0,<26",
    "dramatiq[rabbitmq]>=2.2.1",
    "urllib3>=2.7.0",
    "python-dotenv>=1.2.2",
    "filelock>=3.32.0",
    "virtualenv>=21.7.0",
    "mako>=1.3.12",
    "idna>=3.18",
]

[project.urls]
Homepage = "https://futuramaapi.com"
Documentation = "https://futuramaapi.com/docs"
Repository = "https://github.com/koldakov/futuramaapi"
Issues = "https://github.com/koldakov/futuramaapi/issues"
Changelog = "https://github.com/koldakov/futuramaapi/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pre-commit>=4.6.1,<5"]
test = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "faker>=40.36.0,<41",
    "pygments>=2.20.0,<3",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    ".venv",
    "venv",
]

fix = true
show-fixes = true
output-format = "full"

line-length = 120
indent-width = 4

# Assume Python 3.8
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E",
    "F",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "S",
    "BLE",
    "B",
    "A",
    "C4",
    "DJ",
    "PL",
    "TCH",
    "RUF",
    "TID",
]
ignore = [
    "N818",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy resolves Mapped[...] annotations at runtime, pydantic resolves field annotations.
runtime-evaluated-base-classes = [
    "futuramaapi.db.BaseModel",
    "futuramaapi.db._base.BaseModel",
    "futuramaapi.helpers.BaseSchema",
    "futuramaapi.helpers._pydantic.BaseSchema",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
# docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
# docstring-code-line-length = "dynamic"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.extend-per-file-ignores]
"test_*.py" = [
    "S101",
]

[tool.mypy]
python_version = "3.12"
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
files = [
    "futuramaapi",
    "tests",
]
